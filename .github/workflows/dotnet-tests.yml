
name: .NET Chess Tests

on:
  push:
    branches:
      - main
      - feature/oop-refactoring
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ChessGame.Tests/ChessGame.Tests.csproj

      - name: Build project
        run: dotnet build ChessGame.Tests/ChessGame.Tests.csproj --no-restore

      - name: Run unit tests
        run: dotnet test ChessGame.Tests/ChessGame.Tests.csproj --no-build
